syntax = "proto3";
package WJudger;

service WJudger {
  rpc Judge(JudgeArgs) returns (stream JudgeReply) {}
  rpc Simple(SimpleArgs) returns (SimpleReply) {}
}

enum JudgeStatus {
  OK = 0;
  UNAUTHENTICATED = 1;
  BUSY = 2;
}

enum Language {
  C = 0;
  CPP = 1;
  PASCAL = 2;
  JAVA = 3;
  PYTHON = 4;
}

message SimpleArgs {
  string token = 1;
  string code = 2;
  Language language = 3;
  string input = 4;
}

message SimpleReply {
  JudgeStatus status = 1;
  bool compileError = 2;
  uint32 runtimeError = 3;
  string compileErrorMessage = 4;
  string runtimeErrorMessage = 5;
  uint64 timeused = 6;
  uint64 memoryused = 7;
  string output = 8;
}

message JudgeArgs {
  string token = 1;
  string code = 2;
  Language language = 3;
  uint64 timelimit = 4;
  double memorylimit = 5;
  string datapath = 6;
}

message JudgeReply {
  enum ResultType {
    COMPILE = 0;
    EXECUTE = 1;
  }

  ResultType resultType = 1;
  CompileResult compileResult = 2;
  ExecuteResult executeResult = 3;
}

message CompileResult{
  bool compileError = 1;
  repeated string testcases = 2;
}

message ExecuteResult{
  string testcase = 1;
  uint64 timeused = 2;
  double memoryused = 3;
  uint32 score = 4;
  string verdict = 5;
  string msg = 6;
}
